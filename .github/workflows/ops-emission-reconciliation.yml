name: Ops emission, subscription and Pix alarms

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-emission-reconciliation
  cancel-in-progress: false

jobs:
  schedule-status:
    # Makes the opt-in gate visible: without this the sweep job is silently "skipped".
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      OPS_SCHEDULE_ENABLED: ${{ vars.OPS_SCHEDULE_ENABLED }}
    steps:
      - name: Report schedule gate
        run: |
          if [ "$OPS_SCHEDULE_ENABLED" = "true" ]; then
            echo "Ops schedule: enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ops schedule: DISABLED (OPS_SCHEDULE_ENABLED is not exactly 'true')" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Ops alarms are OFF::OPS_SCHEDULE_ENABLED is not 'true'; no operational alarm is running from this repository"
          fi

  sweep:
    if: vars.OPS_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPS_BASE_URL: ${{ vars.OPS_BASE_URL || 'https://plina.finance' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile orphan subscriptions
        env:
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
          OPS_ROUTE_LABEL: orphan subscription reconciliation
          OPS_ROUTE_PATH: /api/ops/reconciliar-subscricoes
        run: node .github/scripts/call-ops-route.mjs

      - name: Reconcile outgoing Pix
        if: always()
        env:
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
          OPS_ROUTE_LABEL: outgoing Pix reconciliation
          OPS_ROUTE_PATH: /api/ops/pix-saida
        run: node .github/scripts/call-ops-route.mjs

      - name: Check NAV snapshot freshness
        if: always()
        run: node .github/scripts/check-nav-snapshot-freshness.mjs
