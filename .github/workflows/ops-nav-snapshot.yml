name: Daily NAV snapshot

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-nav-snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: vars.OPS_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPS_BASE_URL: ${{ vars.OPS_BASE_URL || 'https://plina.finance' }}
      OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
      OPS_ROUTE_LABEL: daily NAV snapshot
      OPS_ROUTE_MODE: snapshot
      OPS_ROUTE_PATH: /api/ops/snapshot-nav
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish and anchor snapshot
        run: node .github/scripts/call-ops-route.mjs
